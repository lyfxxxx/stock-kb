nas:
  root: '\\Dxp4800-1305\财报&研报'
  companies:
    - "海底捞"
    - "百胜中国"
  read_only: true
  exclude_dirs:
    - "#recycle"

listings:
  海底捞:
    yfinance: "6862.HK"
    akshare_hk: "06862"
    listing_currency: HKD
    report_currency: CNY
  百胜中国:
    yfinance: "YUMC"
    akshare_us: "YUMC"
    listing_currency: USD
    report_currency: USD

data_dir: "data"
db_path: "data/stock_kb.db"
models_dir: "models"

ocr:
  enabled: true
  langs: "chi_sim+eng"
  min_chars: 80

embedding:
  # 初选默认，最终由评测决定
  model: "BAAI/bge-small-zh-v1.5"
  device: "cuda"
  backend: "sentence-transformers"
  chunk_size: 800  # 400 在 freeze hybrid semantic 上从 0.10 掉到 0.05，未采用；改粒度须 index --rebuild-chunks

mcp:
  host: "127.0.0.1"
  port: 8931

eval:
  questions: "eval/questions.yaml"
  top_k: 5

# 收集只下载直链。raw_dir / meta_dir 相对本文件所在目录。研报/电话会失败记到 data/collect_log.jsonl。
collect:
  user_agent: "stock-kb local@localhost"
  raw_dir: "data/raw"
  meta_dir: "data/meta"
  companies:
    百胜中国:
      cik: "0001673358"
    海底捞:
      hkex_code: "06862"
