# 评测问题集 v0.1
# type: exact(精确事实) / keyword(关键词) / semantic(语义) / cross(跨语言混合) / end2end(综合分析)
# expected 中的 file/page 用于自动判定命中；暂缺的可后续补齐
questions:
  - id: exact-01
    type: exact
    question: 海底捞 2018 年营业收入是多少？
    company: 海底捞
    keywords: ["营业收入"]
    statement:
      type: income
      year: 2018
      line_contains: ["收入", "revenue"]
    expected:
      - file: 2018年报.pdf
        page: 158
